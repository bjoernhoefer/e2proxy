[project]
name = "e2proxy"
dynamic = ["version"]
description = "Enigma2 streaming proxy: Plex HDHomeRun emulation, OpenWebif emulation, transcoding, recordings"
requires-python = ">=3.11"
dependencies = []          # standard library only (+ external ffmpeg binary)

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
e2proxy = "e2proxy.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["e2proxy*"]

[tool.setuptools.dynamic]
version = { attr = "e2proxy.version.VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Gate: real errors only (undefined names, syntax, unused imports in new code).
select = ["E9", "F63", "F7", "F82"]
