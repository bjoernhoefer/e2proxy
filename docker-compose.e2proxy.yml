# Runtime definition on the Pi (compose_dir /home/pi/e2proxy, see deploy/targets.json).
# The image is built by CI; pi-deploy pulls <image>@<digest> and retags it as :latest.
services:
  e2proxy:
    image: ghcr.io/bjoernhoefer/e2proxy:latest
    container_name: e2proxy
    restart: unless-stopped
    network_mode: host          # required for SSDP (UDP multicast 1900) + LAN receiver access
    mem_limit: 512m             # NOTE: not enforced on Pi OS without cgroup memory – pi-deploy watches RSS
    volumes:
      - ./data:/data                                # config, EPG, cache, recorder state
      - /mnt/nvme/recordings:/mnt/nvme/recordings   # recordings (external mount)
    environment:
      - E2PROXY_DATA_DIR=/data
    # Healthcheck is baked into the image (/api/health, no receiver access).
